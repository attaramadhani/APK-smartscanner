name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (errors & warnings shown as annotations)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E "^ *(error|warning) " analyze.txt | head -40 | while read -r line; do echo "::warning::$line"; done || true

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "SmartScanner-${abi}.apk"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: SmartScanner-apk
          path: build/app/outputs/flutter-apk/SmartScanner-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SmartScanner build ${{ github.run_number }}
          body: |
            APK otomatis dari commit ${{ github.sha }}.
            - SmartScanner-arm64-v8a.apk  → untuk hampir semua HP Android modern
            - SmartScanner-armeabi-v7a.apk → untuk HP Android lama (32-bit)
          files: build/app/outputs/flutter-apk/SmartScanner-*.apk
